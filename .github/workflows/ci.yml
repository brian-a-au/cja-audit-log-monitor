name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run CI by hand from the Actions tab
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    # Skipped while the repo is private (Actions minutes are limited).
    # Run scripts/ci.sh locally instead.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Format
        run: uv run ruff format --check src tests scripts
      - name: Test
        run: uv run pytest -q --cov

  floors:
    name: Lowest dependency floors
    # Skipped while the repo is private (Actions minutes are limited).
    # Run scripts/ci.sh locally instead.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.11"
      - name: Install the lowest allowed versions
        run: |
          uv venv .ci/lowest --python 3.11
          uv pip install --python .ci/lowest --resolution lowest-direct -e ".[dev]"
      - name: Test
        run: .ci/lowest/bin/pytest -q

  newest:
    name: Newest dependency versions
    # Skipped while the repo is private (Actions minutes are limited).
    # Run scripts/ci.sh locally instead.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
      - name: Install the newest allowed versions
        run: |
          uv venv .ci/newest --python 3.14
          uv pip install --python .ci/newest --resolution highest -e ".[dev]"
      - name: Test
        run: .ci/newest/bin/pytest -q

  build:
    name: Build package
    # Skipped while the repo is private (Actions minutes are limited).
    # Run scripts/ci.sh locally instead.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke test the wheel
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/cja-audit-log-monitor --help
