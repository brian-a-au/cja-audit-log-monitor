[project]
name = "cja-audit-log-monitor"
version = "0.1.1"
description = "Terminal UI and CLI for monitoring and analyzing Adobe Customer Journey Analytics (CJA) audit logs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Brian Au"}
]
keywords = ["adobe", "cja", "customer-journey-analytics", "audit-logs", "cli", "tui", "textual", "security", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "click>=8.2.0",
    "rich>=14.2.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "textual>=7.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.8",
    "pytest-httpx>=0.35.0",
    "pytest-cov>=6.1.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/brian-a-au/cja-audit-log-monitor"
Documentation = "https://github.com/brian-a-au/cja-audit-log-monitor/tree/main/docs"
Issues = "https://github.com/brian-a-au/cja-audit-log-monitor/issues"
Changelog = "https://github.com/brian-a-au/cja-audit-log-monitor/blob/main/CHANGELOG.md"

[project.scripts]
cja-audit-log-monitor = "cja_audit_log_monitor.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cja_audit_log_monitor"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/.env.example"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.coverage.run]
branch = true
source = ["cja_audit_log_monitor"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 95.00

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "real_mount: keep the real on_content_mounted hooks in TUI tests",
]
